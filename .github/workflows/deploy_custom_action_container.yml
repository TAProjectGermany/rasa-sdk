name: Build and Push Custom Actions Image

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorys
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read Poetry Version
        run: |
          echo "POETRY_VERSION=$(scripts/poetry-version.sh)" >> $GITHUB_ENV
        shell: bash

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image
        env:
            DEV_REPOSITORY: ghcr.io/taprojectgermany/rasa-sdk
            DEV_IMAGE_TAG: localdev
        run: |
          IMAGE_NAME=${{ env.DEV_REPOSITORY }} \
          IMAGE_TAG=${{ env.DEV_IMAGE_TAG }} \
          make build-and-push-multi-platform-docker